<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bhajanlal Camera & VFX Lab</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0d12;color:#e6e9ef;font-family:ui-monospace,monospace;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:10px;left:10px;font-size:12px;line-height:1.6;
    background:rgba(0,0,0,.82);color:#f8fafc;padding:8px 12px;border-radius:6px;
    pointer-events:none;border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(6px) saturate(1.2);-webkit-backdrop-filter:blur(6px) saturate(1.2);
    text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 1px rgba(0,0,0,.9);
    box-shadow:0 4px 16px rgba(0,0,0,.5);}
  #hud b{color:#38bdf8;text-shadow:0 1px 2px rgba(0,0,0,.9)}
  #ctrl{position:absolute;bottom:10px;left:10px;font-size:11px;opacity:.9;pointer-events:none;
    color:#f8fafc;text-shadow:0 1px 2px rgba(0,0,0,.9);background:rgba(0,0,0,.55);
    padding:4px 8px;border-radius:4px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud"></div>
<div id="ctrl">WASD drive · Space fire · Shift boost · E explode · R reset camera · T cycle terrain · Mouse look (drag)</div>
<script>
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';}
resize(); addEventListener('resize',resize);

// ---------- math ----------
const V=(x,y)=>({x,y});
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y});
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
const mul=(a,s)=>({x:a.x*s,y:a.y*s});
const len=(a)=>Math.hypot(a.x,a.y);
const norm=(a)=>{const l=len(a)||1;return {x:a.x/l,y:a.y/l};};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// ---------- world ----------
const world={w:4000,h:3000};
const buildings=[];
for(let i=0;i<120;i++){
  buildings.push({x:Math.random()*world.w,y:Math.random()*world.h,w:40+Math.random()*120,h:40+Math.random()*120});
}
const palms=[];
for(let i=0;i<60;i++) palms.push({x:Math.random()*world.w,y:Math.random()*world.h});

// ---------- car ----------
const car={x:world.w/2,y:world.h/2,angle:0,speed:0,boost:0};
const keys={};
const terrainModes=['default','snow','desert','ocean'];
let terrainIdx=0;
let terrain=terrainModes[0];
try{const saved=localStorage.getItem('bhajanlal-terrain');if(saved && terrainModes.includes(saved)){terrain=saved;terrainIdx=terrainModes.indexOf(saved);}}catch(e){}
// Terrain palettes: sky, ground, grid, building, palm colors per terrain
const TERRAIN_PALETTES={
  default:{skyTop:'#1a1f2e',skyBot:'#0b0d12',ground:'#1c2330',grid:'rgba(255,255,255,0.04)',bldg:[40,50,70],palm:'#2d5a3d',palmStem:'#1a3a25'},
  snow:{skyTop:'#cfe8ff',skyBot:'#eaf4ff',ground:'#f2f6fb',grid:'rgba(30,60,100,0.08)',bldg:[180,190,210],palm:'#9ca3af',palmStem:'#6b7280'},
  desert:{skyTop:'#fde68a',skyBot:'#fef3c7',ground:'#d6b370',grid:'rgba(120,80,20,0.10)',bldg:[160,120,70],palm:'#6b8e23',palmStem:'#4a6518'},
  ocean:{skyTop:'#93c5fd',skyBot:'#bfdbfe',ground:'#1e3a8a',grid:'rgba(255,255,255,0.06)',bldg:[30,60,120],palm:'#0ea5e9',palmStem:'#0369a1'}
};
function terrainPalette(){return TERRAIN_PALETTES[terrain]||TERRAIN_PALETTES.default;}
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR')camera.trauma=0;
  if(e.code==='KeyT'){terrainIdx=(terrainIdx+1)%terrainModes.length;terrain=terrainModes[terrainIdx];try{localStorage.setItem('bhajanlal-terrain',terrain);}catch(e){}}
});
addEventListener('keyup',e=>{keys[e.code]=false;});

// ---------- camera ----------
const camera={
  x:car.x,y:car.y,angle:0,fov:60,trauma:0,shakeX:0,shakeY:0,
  target:{x:car.x,y:car.y},
  // spring-arm
  boom:180, // desired distance behind
  height:0
};
let dragging=false, lastMX=0,lastMY=0, yawOffset=0;
canvas.addEventListener('mousedown',e=>{dragging=true;lastMX=e.clientX;lastMY=e.clientY;});
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{
  if(!dragging) return;
  yawOffset += (e.clientX-lastMX)*0.005;
  lastMX=e.clientX;lastMY=e.clientY;
});

function updateCamera(dt){
  // speed-based pullback
  const sp=Math.abs(car.speed);
  const desiredBoom = 180 + sp*1.2;
  camera.boom = lerp(camera.boom, desiredBoom, 0.05);
  // lead offset
  const fwd={x:Math.cos(car.angle),y:Math.sin(car.angle)};
  const lead = sp*0.4;
  const targetX = car.x - fwd.x*camera.boom + fwd.x*lead;
  const targetY = car.y - fwd.y*camera.boom + fwd.y*lead;
  // damping (spring)
  camera.x = lerp(camera.x, targetX, 0.12);
  camera.y = lerp(camera.y, targetY, 0.12);
  // collision: sphere cast against buildings
  for(const b of buildings){
    const cx=clamp(camera.x,b.x,b.x+b.w);
    const cy=clamp(camera.y,b.y,b.y+b.h);
    const dx=camera.x-cx,dy=camera.y-cy;
    const d=Math.hypot(dx,dy);
    const rad=40;
    if(d<rad && d>0.001){
      const push=(rad-d)/d;
      camera.x+=dx*push; camera.y+=dy*push;
    }
  }
  // FOV scaling with speed
  const targetFov = 60 + sp*0.08;
  camera.fov = lerp(camera.fov, targetFov, 0.08);
  // trauma decay + shake
  camera.trauma = Math.max(0, camera.trauma - dt*1.5);
  const shake = camera.trauma*camera.trauma;
  camera.shakeX = (Math.random()*2-1)*shake*18;
  camera.shakeY = (Math.random()*2-1)*shake*18;
  // angle follow
  camera.angle = car.angle + yawOffset;
}

// ---------- particles ----------
const particles=[];
function spawnParticle(x,y,vx,vy,life,color,size){
  particles.push({x,y,vx,vy,life,maxLife:life,color,size,dead:false});
}
function updateParticles(dt){
  for(const p of particles){
    p.x+=p.vx*dt*60; p.y+=p.vy*dt*60;
    p.vy+=0.05*dt*60; // gravity
    p.vx*=0.98; p.vy*=0.98;
    p.life-=dt;
    if(p.life<=0) p.dead=true;
  }
  // remove dead
  for(let i=particles.length-1;i>=0;i--) if(particles[i].dead) particles.splice(i,1);
}
function spawnExplosion(x,y){
  for(let i=0;i<60;i++){
    const a=Math.random()*Math.PI*2;
    const sp=1+Math.random()*6;
    spawnParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.6+Math.random()*0.6,
      Math.random()<0.5?'#ffaa33':'#ff5522',2+Math.random()*3);
  }
  // smoke
  for(let i=0;i<20;i++){
    const a=Math.random()*Math.PI*2;
    const sp=0.5+Math.random()*2;
    spawnParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp-1,1.5+Math.random()*1.5,'#555',4+Math.random()*4);
  }
  camera.trauma=Math.min(1,camera.trauma+0.6);
}
function spawnMuzzle(x,y,angle){
  for(let i=0;i<8;i++){
    const a=angle+(Math.random()-0.5)*0.6;
    const sp=3+Math.random()*4;
    spawnParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.2+Math.random()*0.2,'#ffee88',1.5);
  }
  camera.trauma=Math.min(1,camera.trauma+0.15);
}
function spawnTireSmoke(x,y){
  for(let i=0;i<3;i++){
    spawnParticle(x,y,(Math.random()-0.5)*1,(Math.random()-0.5)*1-0.5,0.8+Math.random()*0.6,'#888',3+Math.random()*3);
  }
}

// ---------- decals ----------
const decals=[];
function spawnDecal(x,y,type){
  decals.push({x,y,type,life:5,maxLife:5});
}

// ---------- update ----------
let last=performance.now();
function update(dt){
  // car control
  const accel = keys['KeyW']?1:(keys['KeyS']?-1:0);
  const steer = keys['KeyA']?-1:(keys['KeyD']?1:0);
  car.speed += accel*0.4*dt*60;
  car.speed *= 0.985;
  car.speed = clamp(car.speed,-4,12);
  if(Math.abs(car.speed)>0.5) car.angle += steer*0.04*(car.speed>0?1:-1)*dt*60;
  car.x += Math.cos(car.angle)*car.speed*dt*60;
  car.y += Math.sin(car.angle)*car.speed*dt*60;
  car.x=clamp(car.x,0,world.w); car.y=clamp(car.y,0,world.h);
  // boost
  if(keys['ShiftLeft'] && car.speed>2){ car.speed*=1.02; spawnTireSmoke(car.x-Math.cos(car.angle)*20, car.y-Math.sin(car.angle)*20); }
  // fire
  if(keys['Space']){ spawnMuzzle(car.x+Math.cos(car.angle)*30, car.y+Math.sin(car.angle)*30, car.angle); }
  // explode
  if(keys['KeyE'] && !keys._e){ spawnExplosion(car.x+Math.cos(car.angle)*60, car.y+Math.sin(car.angle)*60); spawnDecal(car.x+Math.cos(car.angle)*60, car.y+Math.sin(car.angle)*60,'scorch'); keys._e=true;}
  if(!keys['KeyE']) keys._e=false;
  // drift smoke
  if(Math.abs(steer)>0 && Math.abs(car.speed)>4){ spawnTireSmoke(car.x-Math.cos(car.angle)*18, car.y-Math.sin(car.angle)*18); }
  // decals decay
  for(let i=decals.length-1;i>=0;i--){ decals[i].life-=dt; if(decals[i].life<=0) decals.splice(i,1);}
  updateCamera(dt);
  updateParticles(dt);
}

// ---------- render ----------
function worldToScreen(wx,wy){
  const cx=camera.x+camera.shakeX, cy=camera.y+camera.shakeY;
  const scale = W/(world.w*0.6) * (60/camera.fov);
  const sx = (wx-cx)*scale + W/2;
  const sy = (wy-cy)*scale + H/2;
  return {x:sx,y:sy,s:scale};
}

function draw(){
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  const pal=terrainPalette();
  g.addColorStop(0,pal.skyTop); g.addColorStop(1,pal.skyBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // ground
  const s0=worldToScreen(0,0);
  const sc=s0.s;
  ctx.fillStyle=pal.ground;
  ctx.fillRect(0,0,W,H);

  // grid
  ctx.strokeStyle=pal.grid; ctx.lineWidth=1;
  const step=100*sc;
  const ox=s0.x % step, oy=s0.y % step;
  for(let x=ox;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=oy;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // buildings
  for(const b of buildings){
    const p=worldToScreen(b.x,b.y);
    const w=b.w*sc,h=b.h*sc;
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(p.x+4,p.y+4,w,h);
    // body
    const shade=0.4+((b.x+b.y)%50)/200;
    const bc=pal.bldg;
    ctx.fillStyle=`rgba(${Math.floor(bc[0]+shade*40)},${Math.floor(bc[1]+shade*30)},${Math.floor(bc[2]+shade*20)},1)`;
    ctx.fillRect(p.x,p.y,w,h);
    // neon edge
    ctx.strokeStyle='rgba(125,211,252,0.15)'; ctx.lineWidth=1;
    ctx.strokeRect(p.x,p.y,w,h);
  }

  // decals
  for(const d of decals){
    const p=worldToScreen(d.x,d.y);
    const a=d.life/d.maxLife;
    ctx.globalAlpha=a*0.6;
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(p.x,p.y,30*sc,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // palms
  for(const pl of palms){
    const p=worldToScreen(pl.x,pl.y);
    ctx.fillStyle=pal.palm;
    ctx.beginPath(); ctx.arc(p.x,p.y,6*sc,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=pal.palmStem; ctx.lineWidth=2*sc;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x,p.y+12*sc); ctx.stroke();
  }

  // car
  const cp=worldToScreen(car.x,car.y);
  const cs=cp.s;
  ctx.save();
  ctx.translate(cp.x,cp.y);
  ctx.rotate(car.angle);
  // body
  ctx.fillStyle='#e11d48';
  ctx.fillRect(-22*cs,-12*cs,44*cs,24*cs);
  // windshield
  ctx.fillStyle='rgba(100,180,255,0.6)';
  ctx.fillRect(8*cs,-10*cs,12*cs,20*cs);
  // wheels
  ctx.fillStyle='#111';
  ctx.fillRect(-18*cs,-16*cs,10*cs,6*cs);
  ctx.fillRect(-18*cs,10*cs,10*cs,6*cs);
  ctx.fillRect(12*cs,-16*cs,10*cs,6*cs);
  ctx.fillRect(12*cs,10*cs,10*cs,6*cs);
  ctx.restore();

  // particles
  for(const p of particles){
    const sp=worldToScreen(p.x,p.y);
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(sp.x,sp.y,p.size*sc*a,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // chromatic aberration (subtle)
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.03;
  ctx.fillStyle='#ff0000'; ctx.fillRect(camera.shakeX,camera.shakeY,W,H);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  // HUD
  const hud=document.getElementById('hud');
  hud.innerHTML=`<b>Camera & VFX Lab</b> <span style="opacity:.7">· terrain: ${terrain}</span><br>`+
    `speed: ${car.speed.toFixed(1)} · FOV: ${camera.fov.toFixed(1)} · boom: ${camera.boom.toFixed(0)}<br>`+
    `trauma: ${camera.trauma.toFixed(2)} · particles: ${particles.length} · decals: ${decals.length}<br>`+
    `pos: ${car.x.toFixed(0)},${car.y.toFixed(0)} · press T to cycle terrain`;
}

function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
