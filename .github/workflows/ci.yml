name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Lint & offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps
        run: pip install -r requirements-api.txt

      - name: Compile check
        run: python -m compileall -q serve evals

      - name: ADR security gate
        run: python scripts/adr_security_gate.py --all

      - name: Eval harness self-check
        run: python evals/harness.py --self-check

      - name: Smoke-test the backend (no upstream keys needed)
        run: |
          python serve/backend.py &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8790/health
          kill $SERVER_PID

  docker:
    name: Build & smoke-test image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bhajanlal-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container + health check
        run: |
          docker run -d --name bhajanlal-api -p 8790:8790 \
            -e BHAJANLAL_BACKEND_HOST=0.0.0.0 \
            -e BHAJANLAL_ALLOW_LOCALHOST=true \
            bhajanlal-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8790/health
          docker rm -f bhajanlal-api

      - name: Publish image (main only)
        id: publish
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bhajanlal-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.publish.outcome == 'success'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image with Cosign (keyless)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.publish.outcome == 'success'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/bhajanlal-app@${{ steps.publish.outputs.digest }}

      - name: Generate SLSA build provenance
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.publish.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bhajanlal-app
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify Cosign signature
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.publish.outcome == 'success'
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ghcr.io/${{ github.repository_owner }}/bhajanlal-app@${{ steps.publish.outputs.digest }}

      - name: Verify SLSA provenance attestation
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.publish.outcome == 'success'
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ghcr.io/${{ github.repository_owner }}/bhajanlal-app@${{ steps.publish.outputs.digest }}